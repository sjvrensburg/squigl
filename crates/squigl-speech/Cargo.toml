[package]
name = "squigl-speech"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reading aloud for squigl: Kokoro or the system's speech, and maths in words (MathCAT)"

[features]
# squigl's own voice: Kokoro-82M through squigl-models (ONNX Runtime), played
# through cpal (on Linux, ALSA: building needs libasound2-dev).
kokoro = ["dep:squigl-models", "dep:cpal"]

[dependencies]
squigl-engine = { path = "../squigl-engine" }
anyhow.workspace = true
log.workspace = true
# speech-dispatcher on Linux (needs libspeechd-dev and libclang to build), WinRT on
# Windows, AVSpeechSynthesizer on macOS.
tts = "0.26"
# MathML in words, ClearSpeak; its rules zipped into the binary. The alpha is the
# version spike S7 measured.
mathcat = { version = "=0.7.7-alpha.1", features = ["include-zip"] }
squigl-models = { path = "../squigl-models", optional = true }
cpal = { version = "0.16", optional = true }
