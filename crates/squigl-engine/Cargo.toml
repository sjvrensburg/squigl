[package]
name = "squigl-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Squigl's UI-independent logic: the camera worker, selection geometry, rendering, erasing, enhancement, readings and config"

# No UI toolkit, no ONNX Runtime, no Typst: those implement this crate's traits
# from the outside, so any front end can sit on top of it.
[dependencies]
squigl-core = { path = "../squigl-core" }
anyhow.workspace = true
log.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
# Perspective warp for rectifying a detected block (no default features: they pull
# every image format and a text renderer).
imageproc = { version = "0.27", default-features = false, features = ["rayon"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
base64 = "0.22"
directories = "6"
# LaTeX maths to MathML Core, for readings shown as text (roadmap spike S7).
math-core = "0.8"

# The camera worker's optional copy of the stream to a v4l2loopback device.
[target.'cfg(target_os = "linux")'.dependencies]
squigl-v4l2 = { path = "../squigl-v4l2" }

[dev-dependencies]
openh264.workspace = true
# A phone's browser played by str0m, for the paired-phone source.
squigl-pairing = { path = "../squigl-pairing", features = ["testing"] }
