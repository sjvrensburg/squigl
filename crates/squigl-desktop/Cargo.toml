[package]
name = "squigl-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Squigl's desktop app: a Tauri 2 window (web UI) over squigl-engine"
publish = false

[features]
# Serve the built UI (ui/dist, embedded) rather than Vite's dev server at devUrl.
# On by default so a plain `cargo build` makes a working app; for hot reload run
# `npm run dev` in ui/ and `cargo run -p squigl-desktop --no-default-features`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
squigl-core = { path = "../squigl-core" }
squigl-engine = { path = "../squigl-engine" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30"
getrandom = "0.3"
