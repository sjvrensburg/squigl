[package]
name = "squigl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "An Android phone's camera as decoded frames: scrcpy-server over ADB, or WebRTC from a browser"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
openh264 = { workspace = true, features = ["source"] }
ffmpeg-next = { workspace = true, optional = true }
str0m = { version = "0.23.1", default-features = false, features = ["rust-crypto"] }

[features]
default = []
# Decode with the system FFmpeg (libavcodec's native h264 decoder) instead of the
# bundled openh264, lifting the 3840x2160-class size ceiling. Needs libavcodec/
# libavutil development headers at build time and a full (non "-free") FFmpeg.
ffmpeg = ["dep:ffmpeg-next"]

[build-dependencies]
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
env_logger.workspace = true
