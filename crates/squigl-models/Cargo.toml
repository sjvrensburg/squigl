[package]
name = "squigl-models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Squigl's built-in models: GLM-OCR for reading and PP-DocLayoutV3 for block detection, on ONNX Runtime"

# GLM-OCR (onnx-community q4f16 export) as a Transcriber and PP-DocLayoutV3 as a
# BlockDetector, run through ONNX Runtime, WebGPU (Vulkan on Linux) with CPU
# fallback. Downloads pyke's prebuilt ONNX Runtime at build time and the models
# (~650 MB + ~130 MB) on first use.
[dependencies]
# Only to ask the graphics system whether there is a real GPU (see `gpu_present`);
# the same version eframe's wgpu renderer brings, so nothing new is compiled.
wgpu = "30"
pollster = "1"
squigl-engine = { path = "../squigl-engine" }
squigl-misaki = { path = "../squigl-misaki" }
anyhow.workspace = true
log.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
# Contours/min-area-rect for the block detector (no default features: they pull
# every image format and a text renderer).
imageproc = { version = "0.27", default-features = false, features = ["rayon"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# pykeio/ort v2.0.0-rc.15 (ORT 1.31.0); its API differs from the published rc.13,
# and rc.13's prebuilt binaries are gone from the CDN (404 since 2026-10-10).
ort = { git = "https://github.com/pykeio/ort", rev = "5c564c58507f35fa4adc387a79fce1016e73956b", features = ["half", "webgpu"] }
half = "2"
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
sha2 = "0.10"
