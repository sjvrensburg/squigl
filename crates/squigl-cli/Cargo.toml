[package]
name = "squigl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI: stream an Android phone's camera to a Linux V4L2 device"

[[bin]]
name = "squigl-cli"
path = "src/main.rs"

[dependencies]
squigl-core = { path = "../squigl-core" }
squigl-v4l2 = { path = "../squigl-v4l2" }
squigl-pairing = { path = "../squigl-pairing" }
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
ctrlc.workspace = true

[features]
default = []
ffmpeg = ["squigl-core/ffmpeg"]
