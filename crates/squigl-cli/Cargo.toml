[package]
name = "squigl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI: stream an Android phone's camera to a Linux V4L2 device"

[[bin]]
name = "squigl-cli"
path = "src/main.rs"

[dependencies]
phone-cam4linux = { path = "../../phone-cam4linux" }
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
ctrlc.workspace = true
tiny_http = { version = "0.12.0", features = ["ssl-rustls"] }
rcgen = "0.14.10"

[features]
default = []
ffmpeg = ["phone-cam4linux/ffmpeg"]
