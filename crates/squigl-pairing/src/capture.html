<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squigl camera</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; margin: 0; padding: 1rem; }
  video { width: 100%; border-radius: 8px; background: #000; }
  #status { margin-top: 1rem; white-space: pre-wrap; font-size: 0.85rem; color: #9cf; }
  button { font-size: 1.1rem; padding: 0.6rem 1.2rem; margin-top: 1rem; }
</style>
</head>
<body>
<h1>Squigl camera</h1>
<video id="preview" autoplay playsinline muted></video>
<div><button id="start">Start streaming</button></div>
<div id="status">Tap "Start streaming" and allow camera access. Keep this tab open
while streaming; closing it or locking the phone ends the session.</div>
<script>
const statusEl = document.getElementById('status');
// The pairing code's token (from the QR code's address): the server takes an offer
// only with it.
const token = new URLSearchParams(location.search).get('t') ?? '';
const log = (msg) => { statusEl.textContent += '\n' + msg; };

document.getElementById('start').addEventListener('click', start, { once: true });

async function start() {
  try {
    log('requesting camera...');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        // Chrome exposes the camera's zoom only when it is asked for here.
        zoom: true,
      },
      audio: false,
    });
    document.getElementById('preview').srcObject = stream;

    const pc = new RTCPeerConnection();
    const [track] = stream.getVideoTracks();
    // A page of handwriting wants detail, not motion: tell the encoder to keep
    // edges sharp and (below) to hold resolution and spend bits on it.
    track.contentHint = 'detail';
    const settings = track.getSettings ? track.getSettings() : {};
    log(`camera: ${settings.width}x${settings.height} at ${settings.frameRate} fps`);
    const transceiver = pc.addTransceiver(track, { direction: 'sendonly' });
    controls(pc, track);

    // squigl only understands H.264 -- steer the browser's encoder to it (it defaults
    // to VP8/VP9 otherwise) rather than letting negotiation fail on a codec mismatch.
    // packetization-mode 1 first: it is what the far end's depacketiser is best at.
    if (transceiver.setCodecPreferences && typeof RTCRtpSender !== 'undefined' && RTCRtpSender.getCapabilities) {
      const caps = RTCRtpSender.getCapabilities('video');
      const h264 = caps.codecs.filter((c) => c.mimeType.toLowerCase() === 'video/h264');
      h264.sort((a, b) => mode1(b) - mode1(a));
      if (h264.length > 0) {
        transceiver.setCodecPreferences(h264);
      } else {
        log('warning: this browser has no H.264 encoder; streaming will likely fail');
      }
    }

    // Without this the encoder runs on video-call defaults (a megabit or so for a
    // whole page, resolution traded away under load). Ask for the ADB path's class
    // of budget instead, cap the frame rate (a still page gains nothing past it),
    // and hold resolution when the encoder is squeezed.
    try {
      const sender = transceiver.sender;
      const params = sender.getParameters();
      if (!params.encodings || params.encodings.length === 0) params.encodings = [{}];
      params.encodings[0].maxBitrate = 20000000;
      params.encodings[0].maxFramerate = 15;
      params.degradationPreference = 'maintain-resolution';
      await sender.setParameters(params);
    } catch (e) {
      log('warning: could not set encoder parameters: ' + e.message);
    }

    log('creating offer...');
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    // No trickle ICE support server-side (host candidates only, gathered up front),
    // so wait for gathering to finish before sending the single offer/answer round trip.
    await waitForIceGathering(pc);

    log('sending offer...');
    const res = await fetch('/whip?t=' + encodeURIComponent(token), {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp,
    });
    if (!res.ok) {
      throw new Error(`rejected (${res.status}): ${await res.text()}`);
    }
    const answerSdp = await res.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });

    pc.oniceconnectionstatechange = () => log('connection: ' + pc.iceConnectionState);
    log('streaming -- this feeds squigl directly, this preview is just local confirmation.');
    watchEncoder(pc);
  } catch (e) {
    log('error: ' + e.message);
  }
}

// Squigl's camera controls: a data channel on which this page reports the camera
// (its zoom range and zoom, whether it has a torch and whether it is on) when the
// channel opens and once after each message, and takes {"zoom": ratio} and
// {"torch": on}.
function controls(pc, track) {
  const channel = pc.createDataChannel('squigl-control');
  const report = () => {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    const now = track.getSettings ? track.getSettings() : {};
    channel.send(JSON.stringify({
      zoom_range: caps.zoom ? [caps.zoom.min, caps.zoom.max] : null,
      zoom: typeof now.zoom === 'number' ? now.zoom : 1,
      torch: caps.torch ? Boolean(now.torch) : null,
    }));
  };
  channel.onopen = report;
  channel.onmessage = async (event) => {
    try {
      const asked = JSON.parse(event.data);
      const constraint = {};
      if (typeof asked.zoom === 'number') constraint.zoom = asked.zoom;
      if (typeof asked.torch === 'boolean') constraint.torch = asked.torch;
      await track.applyConstraints({ advanced: [constraint] });
    } catch (e) {
      log('camera control: ' + e.message);
    }
    report();
  };
}

function mode1(codec) {
  return (codec.sdpFmtpLine || '').includes('packetization-mode=1') ? 1 : 0;
}

// Some browsers negotiate H.264 happily and then never encode a frame with it
// (a broken hardware-encoder path looks exactly like a network stall from the
// other end). Say so on this page, where the person can act on it.
async function watchEncoder(pc) {
  const [sender] = pc.getSenders();
  if (!sender || !sender.getStats) return;
  for (const wait of [8000, 20000]) {
    await new Promise((r) => setTimeout(r, wait));
    if (pc.connectionState !== 'connected' && pc.iceConnectionState !== 'connected') return;
    try {
      const stats = await sender.getStats();
      let encoded = 0;
      let sent = 0;
      for (const s of stats.values()) {
        if (s.type === 'outbound-rtp') {
          encoded += s.framesEncoded || 0;
          sent += s.bytesSent || 0;
        }
      }
      if (encoded === 0) {
        log('error: the camera is on but this browser is producing no video. ' +
            'Its H.264 encoder appears not to work on this phone; try Chrome.');
        return;
      }
      log(`encoder: ${encoded} frames, ${(sent / 125000).toFixed(1)} Mbit sent so far`);
      return;
    } catch (e) {
      return;
    }
  }
}

function waitForIceGathering(pc) {
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => {
    pc.addEventListener('icegatheringstatechange', function check() {
      if (pc.iceGatheringState === 'complete') {
        pc.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
    });
  });
}
</script>
</body>
</html>
