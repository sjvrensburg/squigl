[package]
name = "squigl-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Squigl's GPUI desktop app: a GPU-accelerated native window over squigl-engine (Linux)"
publish = false
build = "build.rs"

[[bin]]
name = "squigl-gpui"
path = "src/main.rs"

[features]
default = ["local-model"]
ffmpeg = ["squigl-core/ffmpeg"]
local-model = ["dep:squigl-models", "squigl-speech?/kokoro"]
speech = ["dep:squigl-speech"]

[dependencies]
squigl-core = { path = "../squigl-core" }
squigl-engine = { path = "../squigl-engine" }
squigl-pairing = { path = "../squigl-pairing", features = ["testing"] }
squigl-models = { path = "../squigl-models", optional = true }
squigl-speech = { path = "../squigl-speech", optional = true }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-kit = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
smallvec = "1"
