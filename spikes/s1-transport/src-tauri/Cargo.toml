[package]
name = "s1-transport"
version = "0.1.0"
edition = "2021"
publish = false
description = "Roadmap spike S1: how fast can frames get from Rust into a Tauri webview?"

# Its own workspace: not part of squigl's build or CI.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.30"

[profile.release]
debug = false
