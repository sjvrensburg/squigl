[workspace]
resolver = "2"
members = [
    "crates/squigl-core",
    "crates/squigl-v4l2",
    "crates/squigl-engine",
    "crates/squigl-models",
    "crates/squigl-math",
    "crates/squigl-cli",
    "crates/squigl-egui",
    "crates/squigl-desktop",
]
# squigl-desktop is left out of a plain `cargo build`/`cargo test`: Tauri embeds its
# web UI at compile time, which needs `npm run build` in crates/squigl-desktop/ui
# first (and WebKitGTK headers on Linux). Build it with `-p squigl-desktop`.
default-members = [
    "crates/squigl-core",
    "crates/squigl-v4l2",
    "crates/squigl-engine",
    "crates/squigl-models",
    "crates/squigl-math",
    "crates/squigl-cli",
    "crates/squigl-egui",
]

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sjvrensburg/squigl"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
openh264 = "0.9"
v4l = "0.14"
ctrlc = { version = "3", features = ["termination"] }
ffmpeg-next = "9"
