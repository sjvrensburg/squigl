name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs the model job below (the others too) on demand: Actions > CI > Run workflow.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # build.rs downloads and SHA256-verifies scrcpy-server on a clean build; cache it
  # across runs so CI doesn't hit GitHub releases every time.
  SQUIGL_SERVER_JAR: ${{ github.workspace }}/.cache/scrcpy-server.jar

jobs:
  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            args: ""
            apt: ""
          - features: ffmpeg
            args: "--features ffmpeg"
            apt: "libavcodec-dev libavutil-dev libavformat-dev libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # nasm: openh264 assembly; libclang: bindgen for the v4l/ffmpeg -sys crates;
          # xkbcommon/wayland: eframe (squigl) links these on Linux.
          sudo apt-get install -y --no-install-recommends nasm libclang-dev pkg-config libxkbcommon-dev libwayland-dev ${{ matrix.apt }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}

      - name: Cache scrcpy-server jar
        id: jar
        uses: actions/cache@v4
        with:
          path: .cache/scrcpy-server.jar
          key: scrcpy-server-${{ hashFiles('crates/squigl-core/build.rs') }}

      - name: Fetch scrcpy-server jar
        if: steps.jar.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          version=$(sed -n 's/^const SCRCPY_VERSION: &str = "\(.*\)";/\1/p' crates/squigl-core/build.rs)
          curl -fsSL -o .cache/scrcpy-server.jar \
            "https://github.com/Genymobile/scrcpy/releases/download/v${version}/scrcpy-server-v${version}"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.args }} -- -D warnings

      # Libraries only: the binaries' doc comments are clap's --help text
      # (`HOST[:PORT]`, `DIR/<model name>/`), not rustdoc.
      - name: Docs
        run: cargo doc --no-deps --lib ${{ matrix.args }}
        env:
          RUSTDOCFLAGS: -D warnings

      # The engine is shared by every front end, so no UI toolkit, ONNX Runtime or
      # Typst may reach it (they implement its traits from outside).
      - name: Engine stays UI-independent
        run: |
          # Captured first so a failing `cargo tree` fails the step instead of
          # reading as "no match".
          tree=$(cargo tree -p squigl-engine -e normal --prefix none)
          if grep -E '^(egui|eframe|ort|typst|typst-[a-z-]+|mitex) ' <<<"$tree"; then
            echo "squigl-engine must not depend on the crates above" >&2
            exit 1
          fi

      - name: Test
        run: cargo test ${{ matrix.args }}

      - name: Build release binaries
        run: cargo build --release -p squigl-cli -p squigl-egui ${{ matrix.args }}

  # Windows and macOS: the whole workspace builds (squigl-v4l2 is empty there and
  # squigl-cli only says it needs Linux); no ffmpeg (Linux-only by design).
  cross-os:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # openh264's x86 assembly; without nasm it builds the slower C fallback.
      - name: Install nasm
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Cache scrcpy-server jar
        id: jar
        uses: actions/cache@v4
        with:
          path: .cache/scrcpy-server.jar
          key: scrcpy-server-${{ hashFiles('crates/squigl-core/build.rs') }}

      - name: Fetch scrcpy-server jar
        if: steps.jar.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          version=$(sed -n 's/^const SCRCPY_VERSION: &str = "\(.*\)";/\1/p' crates/squigl-core/build.rs)
          curl -fsSL -o .cache/scrcpy-server.jar \
            "https://github.com/Genymobile/scrcpy/releases/download/v${version}/scrcpy-server-v${version}"

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build the window
        run: cargo build --release -p squigl-egui

      # Where ONNX Runtime's WebGPU provider library lands, for packaging (S2).
      - name: List the release directory
        run: ls -la target/release/

  # The Tauri app: its web UI checked, tested and built (Tauri embeds the build),
  # then the crate itself. Not in the jobs above: it is not a default member.
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm libclang-dev pkg-config \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev

      - name: Install nasm
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: crates/squigl-desktop/ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.os }}

      - name: Cache scrcpy-server jar
        id: jar
        uses: actions/cache@v4
        with:
          path: .cache/scrcpy-server.jar
          key: scrcpy-server-${{ hashFiles('crates/squigl-core/build.rs') }}

      - name: Fetch scrcpy-server jar
        if: steps.jar.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          version=$(sed -n 's/^const SCRCPY_VERSION: &str = "\(.*\)";/\1/p' crates/squigl-core/build.rs)
          curl -fsSL -o .cache/scrcpy-server.jar \
            "https://github.com/Genymobile/scrcpy/releases/download/v${version}/scrcpy-server-v${version}"

      - name: Web UI
        working-directory: crates/squigl-desktop/ui
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Clippy
        run: cargo clippy -p squigl-desktop --all-targets -- -D warnings

      - name: Test
        run: cargo test -p squigl-desktop

      # The app through WebDriver (tauri-driver over WebKitWebDriver or msedgedriver)
      # on a synthetic recording: the keyboard, each display mode's pixels against
      # the engine's, text size and theme contrast. macOS has no WebDriver for WKWebView.
      - name: End-to-end tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends webkit2gtk-driver xvfb
          cargo install tauri-driver --locked

      - name: End-to-end tools (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo install tauri-driver --locked
          # msedgedriver matching the installed WebView2, into the working directory.
          cargo install --git https://github.com/chippers/msedgedriver-tool
          msedgedriver-tool
          echo "NATIVE_DRIVER=$PWD/msedgedriver.exe" >> "$GITHUB_ENV"

      - name: End-to-end tests
        if: runner.os != 'macOS'
        # A hang (a driver left holding the test runner's output) once ran to the
        # six-hour job limit; the whole run takes about two minutes.
        timeout-minutes: 30
        env:
          SQUIGL_LOG_FILE: ${{ runner.temp }}/squigl-e2e.log
          SQUIGL_DRIVER_LOG: ${{ runner.temp }}/squigl-driver.log
        run: |
          cargo build --release -p squigl-desktop
          cargo build --release -p squigl-core --example synth_recording
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" node --test crates/squigl-desktop/e2e/app.test.mjs
          else
            node --test crates/squigl-desktop/e2e/app.test.mjs
          fi

      - name: The app's and drivers' logs from the end-to-end tests
        if: failure() && runner.os != 'macOS'
        run: |
          tail -n 200 "$RUNNER_TEMP/squigl-e2e.log" || true
          echo "--- drivers"
          tail -n 100 "$RUNNER_TEMP/squigl-driver.log" || true

      # Where WebView2 wrote its DevTools port, if anywhere: msedgedriver looks
      # under WEBVIEW2_USER_DATA_FOLDER (a scoped dir in SystemTemp).
      - name: WebView2's DevToolsActivePort files (Windows)
        if: failure() && runner.os == 'Windows'
        run: |
          find "$LOCALAPPDATA" /c/Windows/SystemTemp "$RUNNER_TEMP" -name DevToolsActivePort 2>/dev/null \
            | while read -r f; do echo "$f: $(head -1 "$f")"; done
          ls "$LOCALAPPDATA" | grep -i squigl || true

      # The app as msedgedriver starts it (with a Chromium switch), alone, after the
      # tests: a WebView2 browser process outlives its app for a moment and is shared.
      - name: Smoke run (Windows)
        if: always() && runner.os == 'Windows'
        run: |
          SQUIGL_LOG_FILE="$RUNNER_TEMP/smoke.log" ./target/release/squigl-desktop.exe \
            --test-pattern --remote-debugging-port=0 --dev-config "$RUNNER_TEMP/smoke.toml" \
            --dev-snapshot-after 8 --dev-snapshot-path "$RUNNER_TEMP/smoke.png" \
            && echo "smoke run: exit 0" || echo "smoke run: exit $?"
          cat "$RUNNER_TEMP/smoke.log" || true

  # GLM-OCR against the recorded readings, on the CPU (the runners have no GPU), on
  # every OS: on demand only, since it downloads the models (~790 MB, cached).
  models:
    if: github.event_name == 'workflow_dispatch'
    name: models (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    env:
      SQUIGL_TEST_DEVICES: cpu
      SQUIGL_MODEL_DIR: ${{ github.workspace }}/.cache/models
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm libclang-dev pkg-config libxkbcommon-dev libwayland-dev

      - name: Install nasm
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: models-${{ matrix.os }}

      - name: Cache scrcpy-server jar
        id: jar
        uses: actions/cache@v4
        with:
          path: .cache/scrcpy-server.jar
          key: scrcpy-server-${{ hashFiles('crates/squigl-core/build.rs') }}

      - name: Fetch scrcpy-server jar
        if: steps.jar.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          version=$(sed -n 's/^const SCRCPY_VERSION: &str = "\(.*\)";/\1/p' crates/squigl-core/build.rs)
          curl -fsSL -o .cache/scrcpy-server.jar \
            "https://github.com/Genymobile/scrcpy/releases/download/v${version}/scrcpy-server-v${version}"

      # Keyed on the manifests: a pinned revision changes only with them.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('crates/squigl-models/src/models.rs') }}

      - name: GLM-OCR on the CPU
        run: cargo test -p squigl-models --release glmocr -- --ignored --nocapture --test-threads=1

